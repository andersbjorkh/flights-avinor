name: Fetch arrivals and deploy

on:
  schedule:
    # GitHub runs schedules on a best-effort basis; runs may start late or be
    # skipped. Every 10 minutes, off the top of the hour, when load is highest.
    - cron: '4-59/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Each run fetches fresh data, so a newer run supersedes an older one. Cancel
# in-progress runs so one that never gets a runner (timeout-minutes only
# counts once a runner picks the job up) can't hold the group indefinitely.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test
      - run: node scripts/fetch.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
